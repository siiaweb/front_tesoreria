<button type="button" mat-button routerLink="/dashboard" class="m-2">
  <mat-icon>arrow_back</mat-icon>
  Regresar
</button>
<form class="card" [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="card-header">
    <p class="p-0 my-auto">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-envelope"
        viewBox="0 0 16 16"
      >
        <path
          d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"
        />
      </svg>
      Contáctanos!
    </p>
  </div>
  <div class="card-body">
    <section class="mb-2">
      <label for="mensaje" class="form-label fw-bold">Comentario:</label>
      <textarea
        class="form-control form-control-sm w-100"
        formControlName="mensaje"
        oninput="this.value = this.value.toUpperCase()"
      >
      </textarea>
      <div
        class="text-danger"
        *ngIf="mensaje?.touched && mensaje?.hasError('required')"
      >
        El campo comentario es requerido
      </div>
    </section>
    <!-- -->
    <strong>Adjuntar imagen o captura(opcional):</strong>
    <div
      class="paste-zone"
      contenteditable="true"
      (paste)="pegarImagen($event)"
      (dragover)="arrastrarImagen($event)"
      (drop)="soltarImagen($event)"
    >
      <ng-container *ngIf="!previewUrl; else imagenSeleccionada">
        <button
          type="button"
          class="btn btn-link text-secondary p-0"
          (click)="fileInput.click(); $event.stopPropagation()"
        >
          <i class="bi bi-clipboard-plus fs-1"></i>
          selecciona un archivo desde tu dispositivo.
        </button>

        <h6 class="mt-2"></h6>

        <p class="text-muted small mb-1">
          O Mantén presionado aquí para pegar una imagen.
        </p>

        <span class="badge bg-light text-dark">
          PNG, JPG o WEBP · Máximo 10 MB
        </span>

        <input
          #fileInput
          type="file"
          accept="image/png,image/jpeg,image/webp"
          
          hidden
          (change)="seleccionarImagen($event)"
        />
      </ng-container>

      <ng-template #imagenSeleccionada>
        <img [src]="previewUrl" class="img-preview" alt="Vista previa" />

        <div class="mt-2">
          <!-- <button
            type="button"
            class="btn btn-sm btn-outline-primary me-2"
            (click)="fileInput.click(); $event.stopPropagation()"
          >
            <i class="bi bi-arrow-repeat"></i>
            Cambiar
          </button> -->

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="quitarImagen(fileInput); $event.stopPropagation()"
          >
            <i class="bi bi-trash"></i>
            Quitar imagen
          </button>
        </div>
      </ng-template>
    </div>
    <!-- *** -->
  </div>
  <div class="card-footer text-end">
    <button type="submit" class="btn btn-primary">Enviar</button>
  </div>
</form>
