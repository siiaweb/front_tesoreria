
    <h6>Bienvenido(a): </h6>
    <h5><strong>{{ this.nombre }}</strong></h5>
    <div class="titulos-container" *ngFor="let tu of datos">
      <div class="column left-col">
        <h6>{{ tu.unidad_responsable }}</h6>

      <div class="column right-col" style="text-align: right;">

  <div class="column left-col">
    <button type="button" class="card" routerLink="/posts">

  </div>
  <div class="column right-col">
