<block-ui>
  <div style="width: 100%; margin-bottom: 10px;">
    <button mat-button routerLink="/dashboard" style="letter-spacing: 0;">
      <mat-icon>arrow_back</mat-icon>
      Regresar
    </button>
  </div>

  <table class="concepts-table">
    <caption class="text-end">Listado de recibos</caption>
    <thead>
      <tr>
        <th>Folio</th>
        <th>Ref. Pago</th>
        <th>Descripción del pago</th>
        <th>Fecha</th>
        <th>Estatus</th>
        <th>Monto</th>
        <th>Recibo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let recibo of recibos">
        <td>{{ recibo.foliopago }}</td>
        <td>
          <b>{{ recibo.referencia }}</b>
        </td>
        <td>{{ recibo.descripcion }}</td>
        <td>{{ recibo.fecha | date: "dd/MM/yyyy" }}</td>
        <td *ngIf="recibo.estatus == 'A'" style="color: rgb(113, 177, 132)">
          <strong>PAGADO</strong>
        </td>
        <td *ngIf="recibo.estatus == 'P'" style="color: rgb(122, 129, 109)">
          SIN PAGAR
        </td>
        <td style="text-align: center">
          {{ recibo.total | currency: "MXN" : "symbol" }}
        </td>
        <td>
          <section class="seccion">
            <button
              type="button"
              *ngIf="recibo.estatus == 'A'"
              class="custom-btn custom-btn-blue"
              (click)="
                printInvoice(
                  recibo.foliopago,
                  recibo.referencia,
                  recibo.foliodescto
                )
              "
            >
              <mat-icon>receipt</mat-icon> Recibo
            </button>
            <button
              type="button"
              class="custom-btn custom-btn-red"
              target="_blank"
              *ngIf="
                recibo.fautoriza != null &&
                recibo.hasCartaNoAdedudo &&
                recibo.estatus == 'A'                 
              "
              (click)="generarCartaNoAdeudo(recibo.foliopago,recibo.referencia)"
            >
              <mat-icon>picture_as_pdf</mat-icon>Carta no adeudo
            </button>
          </section>
        </td>
      </tr>
    </tbody>
  </table>
</block-ui>
