<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portal Tesorería</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./assets/images/favicon.png" type="image/x-icon" />

    <link href="assets/css/style.css" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  </head>
  <body>
    <script>
      window.errorCallback = function (error) {
        console.error("EVO ERROR:", error);
        notifyAngularCheckoutFinished();
        Swal.fire({
          icon: "error",
          title: "evo ERROR!!!",
          text: JSON.stringify(error),
          showConfirmButton: false,
        
        });

      };

      window.cancelCallback = function () {
        console.warn("EVO CANCELADO");
        notifyAngularCheckoutFinished();
      };

      window.completeCallback = function (resultIndicator, sessionVersion) {
        console.log("EVO COMPLETADO:", resultIndicator, sessionVersion);
        notifyAngularCheckoutFinished();
        const ID = sessionStorage.getItem("MasterID");
        const apiUrl = window.APP_CONFIG?.apiUrl;
        console.log(ID);

        $.ajax({
          url: `${apiUrl}/trespbanco/${ID}`,
          contentType: "application/json; charset=UTF-8",
          type: "POST", //type is any HTTP method
         // data: { trespbanco: ID }, //Data as js object
          success: function () {
            sessionStorage.removeItem("MasterID");
          },
        });
      };
      window.addEventListener("load", function () {
        console.log("Checkout cargado:", typeof window.Checkout);
      });

      function notifyAngularCheckoutFinished() {
          window.dispatchEvent(new Event('evo-checkout-finished'));
      }
    </script>
    <script
      src="https://evopaymentsmexico.gateway.mastercard.com/static/checkout/checkout.min.js"
      data-error="errorCallback"
      data-cancel="cancelCallback"
      data-complete="completeCallback"
    ></script>

    <app-root></app-root>
  </body>
</html>
